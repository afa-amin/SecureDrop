[package]
name = "securedrop"
version = "0.1.0"
edition = "2021"
authors = ["SecureDrop Contributors"]
description = "Policy-based file encryption using CP-ABE for organizational use"
license = "MIT"
readme = "README.md"

[dependencies]
bls12_381 = { version = "0.8.0", features = ["experimental"] }
group = "0.13"
ff = "0.13"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.8"
rand = "0.8.5"
rand_core = "0.6.4"
zeroize = "1.5.7"
serde = { version = "1.0.195", features = ["derive"] }
bincode = "1.3.3"
serde_json = "1.0.111"
clap = { version = "4.4.18", features = ["derive", "cargo"] }
dirs = "5.0.1"
chrono = { version = "0.4.31", features = ["serde"] }
hex = "0.4.3"
thiserror = "1.0.56"
anyhow = "1.0.79"
base64 = "0.21.7"
subtle = "2.5.0"

[dev-dependencies]
tempfile = "3.9.0"